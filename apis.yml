aid: pvh-corp
name: PVH Corp
description: >-
  PVH Corp, formerly known as the Phillips-Van Heusen Corporation, is an
  American clothing company headquartered in Manhattan, New York City and
  listed on the New York Stock Exchange under the ticker PVH. Founded in 1881,
  PVH today operates two iconic owned global brands — Calvin Klein and Tommy
  Hilfiger — along with licensed brands including Kenneth Cole New York and
  Michael Kors. PVH divested its Heritage Brands wholesale business (Van
  Heusen, Arrow, Izod, Geoffrey Beene) to Authentic Brands Group in August
  2021, refocusing the company on its two flagship designer lifestyle brands.
  PVH does not currently publish a public developer API or developer portal
  at the corporate level; technology and commerce integrations are handled
  brand-by-brand and through closed wholesale, licensing, and retail
  technology partnerships.
